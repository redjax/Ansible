---
- name: Detect DNS backend
  ansible.builtin.import_tasks: detect_dns.yml

- name: Check socket
  ansible.builtin.stat:
    path: /var/run/netbird.sock
  register: sock

- name: Fail if socket missing
  ansible.builtin.fail:
    msg: "NetBird daemon not running"
  when: not sock.stat.exists

- name: Get status
  ansible.builtin.command: netbird status
  register: status
  changed_when: false
  failed_when: false

- name: Fail if disconnected
  ansible.builtin.fail:
    msg: "{{ status.stdout }}"
  when: >
    'Management: Connected' not in status.stdout or
    'Signal: Connected' not in status.stdout

- name: DNS test (systemd-resolved)
  ansible.builtin.command: resolvectl query google.com
  register: dns_resolved
  changed_when: false
  failed_when: false
  when: netbird_dns_mode_effective == "systemd-resolved"

- name: DNS test (NetworkManager / resolvconf)
  ansible.builtin.command: getent ahosts google.com
  register: dns_generic
  changed_when: false
  failed_when: false
  when: netbird_dns_mode_effective != "systemd-resolved"

- name: Validate DNS
  ansible.builtin.fail:
    msg: "DNS broken on backend {{ netbird_dns_mode_effective }}"
  when: >
    (netbird_dns_mode_effective == "systemd-resolved" and dns_resolved.rc != 0) or
    (netbird_dns_mode_effective != "systemd-resolved" and dns_generic.rc != 0)
