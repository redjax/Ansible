---
########################################################
# Task to reset Netbird. Use as a troubleshooting step #
# when the client service isn't working correctly.     #
########################################################

- name: Check NetBird socket exists
  ansible.builtin.stat:
    path: /var/run/netbird.sock
  register: netbird_sock

- name: Restart NetBird if socket is missing
  ansible.builtin.systemd:
    name: netbird
    state: restarted
  when: not netbird_sock.stat.exists

- name: Wait for NetBird socket to appear
  ansible.builtin.wait_for:
    path: /var/run/netbird.sock
    timeout: 30

- name: Check NetBird status
  ansible.builtin.command: netbird status
  register: netbird_status
  changed_when: false
  failed_when: false

- name: Restart NetBird if not connected
  ansible.builtin.systemd:
    name: netbird
    state: restarted
  when: >
    netbird_status.rc != 0 or
    ('Disconnected' in netbird_status.stdout)

- name: Wait for WireGuard interface
  ansible.builtin.command: ip link show wt0
  register: wg_check
  retries: 5
  delay: 3
  until: wg_check.rc == 0
  changed_when: false

- name: DNS check (systemd-resolved)
  ansible.builtin.command: resolvectl query google.com
  register: dns_check_resolved
  changed_when: false
  failed_when: false
  when: netbird_dns_mode_effective == "systemd-resolved"

- name: DNS check (generic NSS resolver)
  ansible.builtin.command: getent ahosts google.com
  register: dns_check_generic
  changed_when: false
  failed_when: false
  when: netbird_dns_mode_effective != "systemd-resolved"

- name: Fail if DNS is not working
  ansible.builtin.fail:
    msg: |
      DNS reconciliation failed.

      Mode: {{ netbird_dns_mode_effective }}

      NetBird status:
      {{ netbird_status.stdout }}
  when: >
    (netbird_dns_mode_effective == "systemd-resolved" and (dns_check_resolved.rc | default(1)) != 0) or
    (netbird_dns_mode_effective != "systemd-resolved" and (dns_check_generic.rc | default(1)) != 0)

- name: Final NetBird status validation
  ansible.builtin.command: netbird status
  register: final_status
  changed_when: false

- name: Fail if reconciliation did not fix state
  ansible.builtin.fail:
    msg: |
      NetBird reconciliation failed.
      Final status:
      {{ final_status.stdout }}
  when: >
    final_status.rc != 0 or
    ('Disconnected' in final_status.stdout)
