---
- name: Load distro vars
  ansible.builtin.import_tasks: load_vars.yml

- name: Assert supported OS family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Suse']
    fail_msg: "Unsupported OS family for this role: {{ ansible_facts['os_family'] }}"

- name: Assert package management prerequisites are available
  ansible.builtin.assert:
    that:
      - netbird_package_name is defined
      - netbird_package_name | length > 0
    fail_msg: "netbird_package_name must be set by distro vars"

- name: Install prereqs on Debian family
  ansible.builtin.apt:
    name: "{{ netbird_prereq_packages }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Install prereqs on RedHat family
  ansible.builtin.package:
    name: "{{ netbird_prereq_packages }}"
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Install prereqs on SUSE family
  ansible.builtin.zypper:
    name: "{{ netbird_prereq_packages }}"
    state: present
  when: ansible_facts['os_family'] == "Suse"

- name: Add NetBird repo key on Debian
  ansible.builtin.get_url:
    url: "{{ netbird_repo_key_url }}"
    dest: "{{ netbird_repo_keyring }}"
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Add NetBird apt repo on Debian
  ansible.builtin.apt_repository:
    repo: "{{ netbird_repo_line }}"
    filename: netbird
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Refresh apt cache on Debian
  ansible.builtin.apt:
    update_cache: true
  when: ansible_facts['os_family'] == "Debian"

- name: Add NetBird repo key on RedHat/SUSE
  ansible.builtin.rpm_key:
    key: "{{ netbird_repo_key_url }}"
    state: present
  when: ansible_facts['os_family'] in ["RedHat", "Suse"]

- name: Add NetBird repo on RedHat/SUSE
  ansible.builtin.yum_repository:
    name: netbird
    description: NetBird repository
    baseurl: "https://pkgs.netbird.io/rpm/"
    enabled: true
    gpgcheck: true
    gpgkey: "{{ netbird_repo_key_url }}"
  when: ansible_facts['os_family'] in ["RedHat", "Suse"]

- name: Install NetBird package
  ansible.builtin.package:
    name: "{{ netbird_package_name }}"
    state: "{{ 'latest' if netbird_update_packages | bool else 'present' }}"
  notify: restart netbird
