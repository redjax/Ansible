---
- name: "Ensure NetBird is stopped before cleanup"
  ansible.builtin.systemd:
    name: netbird
    state: stopped
  failed_when: false

- name: Check if NetBird systemd unit exists
  ansible.builtin.command: systemctl list-unit-files netbird.service
  register: netbird_unit
  changed_when: false
  failed_when: false

- name: "Clean NetBird state files"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/netbird/identity.json
    - /var/lib/netbird/config.json
    - /var/lib/netbird/client.db
    - /var/lib/netbird/db.sqlite
    - /var/lib/netbird/netbird.db
  failed_when: false

- name: Reset NetBird failed state
  ansible.builtin.command: systemctl reset-failed netbird
  when: netbird_unit.rc == 0
  changed_when: false
  failed_when: false
