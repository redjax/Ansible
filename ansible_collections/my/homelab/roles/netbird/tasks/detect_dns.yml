---
- name: Detect systemd-resolved
  ansible.builtin.command: resolvectl status
  register: resolvectl_check
  changed_when: false
  failed_when: false

- name: Detect NetworkManager
  ansible.builtin.command: nmcli general status
  register: nmcli_check
  changed_when: false
  failed_when: false

- name: Detect NetBird-managed resolv.conf
  ansible.builtin.command: cat /etc/resolv.conf
  register: resolv_conf
  changed_when: false

- name: Detect stub resolver usage
  ansible.builtin.stat:
    path: /run/systemd/resolve/stub-resolv.conf
  register: systemd_stub

- name: Classify DNS backend
  ansible.builtin.set_fact:
    netbird_dns_mode_detected: >-
      {% if 'Generated by NetBird' in resolv_conf.stdout %}
      resolvconf
      {% elif systemd_stub.stat.exists and resolvectl_check.rc == 0 %}
      systemd-resolved
      {% elif nmcli_check.rc == 0 %}
      networkmanager
      {% else %}
      disabled
      {% endif %}

- name: Set final DNS mode (auto override)
  ansible.builtin.set_fact:
    netbird_dns_mode_effective: >-
      {{ netbird_dns_mode if netbird_dns_mode != 'auto'
         else netbird_dns_mode_detected }}
