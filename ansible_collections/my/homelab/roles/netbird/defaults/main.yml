---
netbird_enabled: true

## client or server
netbird_role: client
netbird_register: true
netbird_update_packages: true

netbird_management_url: "https://vpn.example.com"
netbird_setup_key: ""

netbird_enable_peer_ssh: false
netbird_enable_peer_ssh_root: false

netbird_manage_firewall: true
netbird_firewall_backend: auto

netbird_manage_host_ssh: false
netbird_host_ssh_port: 22
netbird_manage_host_ssh_firewall: false
netbird_host_ssh_allow_from_cidrs: []

netbird_manage_dns: true

## DNS Modes
#  auto = detect per-host
#  systemd-resolved = use resolvectl-safe behavior
#  networkmanager = rely on NM DNS stack
#  resolvconf = NetBird-managed resolv.conf
#  disabled = NetBird never touches DNS
netbird_dns_mode: disabled

## Computed at runtime, do not set in group_vars
netbird_dns_mode_effective: ""
## Internal detection result
netbird_dns_backend: ""

netbird_service_enabled: true
netbird_service_state: started
