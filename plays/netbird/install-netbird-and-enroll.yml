---
- name: "Install and Enroll NetBird"
  hosts: all
  become: true
  gather_facts: true

  vars:
    netbird_role: client
    netbird_register: true
    netbird_management_url: "{{ netbird_server_url | default('https://vpn.example.com') }}"
    netbird_setup_key: "{{ netbird_enroll_key }}"
    netbird_enable_peer_ssh: false
    netbird_enable_peer_ssh_root: false
    netbird_manage_host_ssh: false
    netbird_manage_firewall: false
    netbird_manage_dns: false
    netbird_firewall_backend: auto
    netbird_update_packages: true

  tasks:
    - name: "Gather facts"
      ansible.builtin.import_role:
        name: my.homelab.facts

    - name: "Install NetBird"
      ansible.builtin.import_role:
        name: my.homelab.netbird
        tasks_from: install.yml

    - name: "Configure logrotate for NetBird"
      ansible.builtin.import_role:
        name: my.homelab.netbird
        tasks_from: logging.yml

    - name: "Restart NetBird service"
      ansible.builtin.systemd:
        name: netbird
        state: restarted
        daemon_reload: true

    - name: "Wait for NetBird socket"
      ansible.builtin.wait_for:
        path: /var/run/netbird.sock
        state: present
        timeout: 30

    - name: "Wait for NetBird daemon stabilization"
      ansible.builtin.pause:
        seconds: 3

    - name: "Wait for NetBird service to start"
      ansible.builtin.command: netbird status
      register: nb_ready
      retries: 25
      delay: 2
      until: nb_ready.rc == 0
      changed_when: false

    - name: "Debug netbird_manage_dns value"
      ansible.builtin.debug:
        var: netbird_manage_dns

    - name: "Enroll NetBird"
      ansible.builtin.import_role:
        name: my.homelab.netbird
        tasks_from: enroll.yml

    - name: "Wait for NetBird DNS to be functional"
      ansible.builtin.command: getent hosts google.com
      register: dns_ready
      retries: 25
      delay: 2
      until: dns_ready.rc == 0
      changed_when: false

    - name: "Healthcheck NetBird"
      ansible.builtin.import_role:
        name: my.homelab.netbird
        tasks_from: health.yml
