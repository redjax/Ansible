---
- name: "Uninstall NetBird"
  hosts: all
  become: true
  gather_facts: true

  vars:
    netbird_purge_data: false

  tasks:
    - name: "Gather facts"
      ansible.builtin.import_role:
        name: my.homelab.facts

    - name: "Uninstall NetBird"
      ansible.builtin.import_role:
        name: my.homelab.netbird
        tasks_from: uninstall.yml
